<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laplace's Demon - Time Controller</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 16px;
        }

        @media (max-width: 1200px) {
            body {
                font-size: 14px;
            }
            .particle-container {
                height: 300px !important;
            }
        }

        @media (max-width: 800px) {
            body {
                font-size: 12px;
            }
            .particle-container {
                height: 240px !important;
            }
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #4a5568;
            outline: none;
            margin: 10px 0;
        }

        /* 胶囊形状的滑块 */
        input[type="range"].capsule-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 40px;
            height: 16px;
            border-radius: 8px;
            background: #63b3ed;
            cursor: pointer;
            transition: background .15s ease-in-out;
        }

        input[type="range"].capsule-thumb::-webkit-slider-thumb:hover {
            background: #4299e1;
        }

        /* 圆形的滑块 */
        input[type="range"].round-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #63b3ed;
            cursor: pointer;
            transition: background .15s ease-in-out;
        }

        input[type="range"].round-thumb::-webkit-slider-thumb:hover {
            background: #4299e1;
        }

        .particle-container {
            background-color: #000000;
            border-radius: 0.5rem;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const TimeControlParticles = () => {
          const [particles, setParticles] = React.useState([]);
          const [absoluteTime, setAbsoluteTime] = React.useState(50);
          const [relativeTime, setRelativeTime] = React.useState(50);
          const particleCount = 200;
          
          React.useEffect(() => {
            const initialParticles = Array.from({ length: particleCount }, (_, index) => {
              const gridSize = Math.ceil(Math.sqrt(particleCount));
              const row = Math.floor(index / gridSize);
              const col = index % gridSize;
              
              const x = (col / gridSize) * 100;
              const y = (row / gridSize) * 100;
              const angle = Math.random() * Math.PI * 2;
              const speed = 2 + Math.random() * 6;
              
              return {
                id: Math.random(),
                baseX: x,
                baseY: y,
                angle: angle,
                speed: speed,
                hue: Math.floor(Math.random() * 360),
                fullEndX: x + Math.cos(angle) * speed * 10,
                fullEndY: y + Math.sin(angle) * speed * 10,
              };
            });
            setParticles(initialParticles);
          }, []);

          const calculatePosition = (particle, absTime, relTime) => {
            const baseT = absTime / 100;
            const baseX = particle.baseX + (particle.fullEndX - particle.baseX) * baseT;
            const baseY = particle.baseY + (particle.fullEndY - particle.baseY) * baseT;

            const lineX = baseX;
            const lineY = baseY;

            const relativeOffset = ((relTime - 50) / 50) * 0.1;
            const currentX = baseX + Math.cos(particle.angle) * particle.speed * 10 * relativeOffset;
            const currentY = baseY + Math.sin(particle.angle) * particle.speed * 10 * relativeOffset;

            return {
              x: currentX,
              y: currentY,
              lineCenter: {
                x: lineX,
                y: lineY
              }
            };
          };

          return (
            <div className="w-full max-w-4xl">
              <div className="bg-gray-900 rounded-lg p-6">
                <h2 className="text-2xl font-bold text-white mb-4">Laplace's Demon - Dual Time Dimension Controller</h2>
                
                <div className="relative h-96 particle-container mb-4">
                  <div className="absolute inset-0">
                    {particles.map((particle) => {
                      const pos = calculatePosition(particle, absoluteTime, relativeTime);
                      
                      return (
                        <div key={particle.id} className="absolute" style={{
                          width: '100%',
                          height: '100%',
                          pointerEvents: 'none'
                        }}>
                          {/* Trail Line */}
                          <div
                            className="absolute"
                            style={{
                              backgroundColor: `hsla(${particle.hue}, 100%, 50%, 0.3)`,
                              height: '2px',
                              position: 'absolute',
                              left: `${pos.lineCenter.x}%`,
                              top: `${pos.lineCenter.y}%`,
                              width: `${particle.speed * 2}%`,
                              transform: `translate(-50%, -50%) rotate(${particle.angle}rad)`,
                              transformOrigin: '50% 50%',
                            }}
                          />
                          
                          {/* Particle */}
                          <div
                            className="absolute rounded-full"
                            style={{
                              width: '4px',
                              height: '4px',
                              backgroundColor: `hsl(${particle.hue}, 100%, 70%)`,
                              left: `${pos.x}%`,
                              top: `${pos.y}%`,
                              transform: 'translate(-50%, -50%)',
                              boxShadow: `0 0 4px hsla(${particle.hue}, 100%, 70%, 0.8)`,
                            }}
                          />
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Absolute Time Control */}
                <div className="flex flex-col gap-2 mb-4">
                  <div className="text-white font-bold">Absolute Time (Global Time Flow)</div>
                  <div className="flex justify-between text-gray-300 text-sm">
                    <span>Past</span>
                    <span>Present</span>
                    <span>Future</span>
                  </div>
                  <input
                    type="range"
                    className="capsule-thumb"
                    min="0"
                    max="100"
                    value={absoluteTime}
                    onChange={(e) => setAbsoluteTime(Number(e.target.value))}
                  />
                  <div className="text-gray-300 text-center">
                    Absolute Time Position: {absoluteTime}%
                  </div>
                </div>

                {/* Relative Time Control */}
                <div className="flex flex-col gap-2">
                  <div className="text-white font-bold">Relative Time (±10% Range)</div>
                  <div className="flex justify-between text-gray-300 text-sm">
                    <span>-10%</span>
                    <span>Current</span>
                    <span>+10%</span>
                  </div>
                  <input
                    type="range"
                    className="round-thumb"
                    min="0"
                    max="100"
                    value={relativeTime}
                    onChange={(e) => setRelativeTime(Number(e.target.value))}
                  />
                  <div className="text-gray-300 text-center">
                    Relative Time Offset: {((relativeTime - 50) / 5).toFixed(1)}%
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <TimeControlParticles />
        );
    </script>
</body>
</html>
