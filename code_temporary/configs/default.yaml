# configs/default.yaml

# 波函数场配置
wave_field:
  enabled: true
  num_waves: 256  # 波函数组数
  scales: [1.0, 0.5, 0.25]  # 多尺度配置
  scale_weights: [1.0, 0.7, 0.5]
  prob_threshold: 0.5

# 网格配置
grid:
  size: 64  # 3D网格分辨率
  prob_threshold: 0.5

# 模型架构配置
model:
  text:
    embedding_dim: 768  # BERT输出维度
    hidden_dim: 256
  
  wave_encoder:
    hidden_dim: 256
    dropout: 0.1
  
  feature_extractor:
    input_dim: 4  # 实部、虚部、振幅、相位
    hidden_dim: 64
    output_dim: 32
    dropout: 0.1

  decoder:
    conv3d_channels: [32, 64, 128, 64, 4]  # 最后4通道: RGB + 概率
    kernel_size: 3
    padding: 1
    dropout: 0.1

# 相机配置
camera:
  default_view: "front"
  fov: 60
  near: 0.1
  far: 100.0
  views:
    front: [0, 0, 2]
    back: [0, 0, -2]
    left: [-2, 0, 0]
    right: [2, 0, 0]
    top: [0, 2, 0]
    bottom: [0, -2, 0]

# 生成配置
generation:
  mode: "image"  # "image" 或 "video"
  time:
    start: 0.0
    end: 12.0
    fps: 30
    timestep: 0.0  # 用于单帧图像生成

# 训练配置
training:
  mode: "mixed"  # "wsv", "wsg" 或 "mixed"
  batch_size: 32
  epochs: 100
  group_size: 16  # GRPO 组大小
  learning_rate: 0.0001
  
# 数据配置
data:
  text_file: "data/descriptions.txt"
  wsv_dir: "data/wsv"
  wsg_dir: "data/wsg"